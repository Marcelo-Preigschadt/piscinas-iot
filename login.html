<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login | Sistema de Piscinas</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-container">
    <h1>Sistema de Piscinas</h1>
    <p>Acesso Restrito</p>

    <span id="erro"></span>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
