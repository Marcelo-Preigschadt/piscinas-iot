<body>
  <main class="auth-card">
    <div class="auth-brand">
      <span class="auth-icon" aria-hidden="true"></span>
      <div><h1>Quatrin AquaControl</h1><p>Gestão Inteligente de Piscinas</p></div>
    </div>
    <div class="auth-heading"><span class="auth-kicker">QUATRIN PISCINAS</span><h2>Bem-vindo</h2><p>Acesse o painel para acompanhar sua piscina, automação, consumo de energia e parâmetros da água.</p></div>
    <label>Usuário<input type="text" id="usuario" autocomplete="username" placeholder="Digite seu usuário"></label>
    <label>Senha<input type="password" id="senha" autocomplete="current-password" placeholder="Digite sua senha"></label>
    <button id="btnEntrar" type="button" onclick="login()">Entrar no AquaControl</button>
    <span id="erro"></span>
    <a class="about-login" href="sobre.html">Conheça o sistema</a>
  </main>
