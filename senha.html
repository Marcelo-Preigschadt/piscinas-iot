<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#031824">
  <title>Primeiro acesso | Quatrin AquaControl</title>
  <link rel="stylesheet" href="css/login.css?v=20260814-13">
</head>
<body>
  <main class="auth-card">
    <div class="auth-brand">
      <span class="auth-icon" aria-hidden="true"></span>
      <div>
        <h1>Quatrin AquaControl</h1>
        <p>Gestão Inteligente de Piscinas</p>
      </div>
    </div>

    <div class="auth-heading">
      <span class="auth-kicker">PRIMEIRO ACESSO</span>
      <h2>Crie sua nova senha</h2>
      <p>A senha recebida do administrador é provisória e deve ser substituída antes de acessar sua piscina.</p>
    </div>

    <div class="first-access-note">Defina uma senha pessoal para concluir a ativação do seu acesso.</div>

    <label>Nova senha
      <input type="password" id="novaSenha" autocomplete="new-password" placeholder="Nova senha">
    </label>

    <label>Confirmar nova senha
      <input type="password" id="confirmarSenha" autocomplete="new-password" placeholder="Digite novamente">
    </label>

    <div class="password-rules">Use no mínimo 6 caracteres.</div>

    <button id="btnSalvarSenha" type="button">Salvar nova senha</button>
    <span id="statusSenha"></span>
  </main>

  <script src="js/senha.js?v=20260814-6"></script>
</body>
</html>
