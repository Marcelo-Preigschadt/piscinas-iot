name: Criar backup ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/create-backup.yml'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar ZIP do sistema
        shell: bash
        run: |
          mkdir -p backups
          DATA=$(date -u +'%Y-%m-%d_%H-%M-%S')
          ARQUIVO="backups/piscinas-iot-backup-${DATA}-${GITHUB_SHA::7}.zip"
          zip -r "$ARQUIVO" . \
            -x '.git/*' \
            -x 'backups/*'
          echo "BACKUP_FILE=$ARQUIVO" >> "$GITHUB_ENV"

      - name: Salvar backup no repositório
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BACKUP_FILE"
          git commit -m "Backup completo do sistema [skip backup]"
          git push origin HEAD:master
